    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Running Pace Calculator",
        "url": "https://running-pace-calculator.correia95.workers.dev/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Calculate running pace, finish time or distance, with race-time predictions and even-pace splits."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I calculate my running pace?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Divide your time by the distance. A 25 minute 5 km is 1500 seconds divided by 5, which is 300 seconds or 5 minutes per kilometre. To find a finish time, multiply your pace by the distance."
            }
          },
          {
            "@type": "Question",
            "name": "What pace do I need for a sub-2-hour half marathon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A 1:59:59 half marathon over 21.0975 km is about 5:41 per kilometre, or 9:09 per mile. Enter 1:59:00 as the time and Half marathon as the distance to see it, along with the splits."
            }
          },
          {
            "@type": "Question",
            "name": "How are the race-time predictions worked out?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Using Peter Riegel's 1981 formula: predicted time equals your known time times the ratio of the distances to the power 1.06. It is reliable from about 1500 m to the half marathon; marathon predictions from short races tend to be optimistic."
            }
          },
          {
            "@type": "Question",
            "name": "How do I convert pace to speed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pace and speed are reciprocals. 5:00 per kilometre is 12.0 km/h; 6:00 per kilometre is 10.0 km/h. The calculator shows both, in km/h and mph, for any pace you enter."
            }
          }
        ]
      }
    </script>
  </head>

      </p>
    </noscript>
